name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'Conection/apps_script/**'
  workflow_dispatch:

jobs:
  deploy-gas:
    name: Deploy via Clasp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Setup Clasp Auth
        if: env.CLASPRC_JSON != ''
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Setup .clasp.json
        if: env.GAS_SCRIPT_ID != ''
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          echo "{\"scriptId\":\"$GAS_SCRIPT_ID\",\"rootDir\":\".\"}" > Conection/apps_script/.clasp.json

      - name: Push to Google Apps Script
        run: |
          cd Conection/apps_script
          clasp push --force
